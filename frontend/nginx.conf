server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API diteruskan ke wadah backend dari sini, sehingga hanya SATU port yang
    # perlu dibuka ke host. Inilah yang membuat deploy sub-direktori menjadi
    # sederhana: reverse proxy di host cukup mengarah ke port ini, dan seluruh
    # aplikasi (halaman maupun API) ikut terbawa. Tanpa ini, host harus
    # memetakan dua location ke dua port berbeda.
    #
    # proxy_pass memakai akhiran "/" sehingga prefiks location diganti apa
    # adanya: /api/spk/criteria tetap sampai ke Laravel sebagai
    # /api/spk/criteria.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA: setiap jalur yang bukan berkas nyata dikembalikan ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Berkas ber-hash boleh di-cache lama, tetapi index.html tidak — kalau
    # tidak, rilis baru tidak akan terpakai sampai pengguna menghapus cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
