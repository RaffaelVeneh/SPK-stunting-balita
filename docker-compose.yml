services:
  # MySQL Database
  mysql:
    image: mysql:8.4
    container_name: spk-stunting-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: spk_stunting
      MYSQL_USER: spk_user
      MYSQL_PASSWORD: spk_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # phpMyAdmin Web UI
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: spk-stunting-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: spk_user
      PMA_PASSWORD: spk_password
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: spk-stunting-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spk-stunting-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../dataset:/var/www/dataset:ro
    environment:
      - APP_NAME="SPK Stunting UNY"
      - APP_ENV=production
      - APP_KEY=base64:3f5uQd6k7p9R8xW1vA4zM2yT7nL0bV8sC1xZ4mQ7wE0=
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=spk_stunting
      - DB_USERNAME=spk_user
      - DB_PASSWORD=spk_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: sh -c "php artisan migrate --force --seed && php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # React SPA Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spk-stunting-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
