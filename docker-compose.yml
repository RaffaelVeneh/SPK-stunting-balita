name: spk-stunting

services:
  # MySQL Database
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: spk-stunting-mysql
    mem_limit: 768m
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-spk_stunting}
      MYSQL_USER: ${MYSQL_USER:-spk_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-spk_password}
    ports:
      # Diikat ke 127.0.0.1 saja. Tanpa ini, MySQL terbuka ke seluruh internet.
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # phpMyAdmin Web UI
  phpmyadmin:
    image: ${PMA_IMAGE:-phpmyadmin/phpmyadmin:latest}
    container_name: spk-stunting-phpmyadmin
    mem_limit: 192m
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-spk_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-spk_password}
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy

  # Redis Cache & Queue
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: spk-stunting-redis
    mem_limit: 192m
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spk-stunting-backend
    mem_limit: 512m
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ../dataset:/var/www/dataset:ro
    environment:
      - APP_NAME=${APP_NAME:-SPK Stunting UNY}
      - APP_ENV=${APP_ENV:-production}
      # Nilai cadangan di bawah HANYA untuk pengembangan lokal. Di produksi WAJIB
      # diisi dari .env dengan hasil `php artisan key:generate --show`.
      - APP_KEY=${APP_KEY:-base64:3f5uQd6k7p9R8xW1vA4zM2yT7nL0bV8sC1xZ4mQ7wE0=}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_DATABASE:-spk_stunting}
      - DB_USERNAME=${MYSQL_USER:-spk_user}
      - DB_PASSWORD=${MYSQL_PASSWORD:-spk_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: sh -c "php artisan migrate --force --seed && php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # React SPA Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Nilai-nilai ini ditanamkan Vite saat build. Untuk VPS sub-direktori,
      # isi berkas .env di folder ini dengan:
      #   VITE_BASE_PATH=/stunting-balita/
      #   VITE_API_URL=/stunting-balita/api
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_ALLOW_LOCAL_FALLBACK: ${VITE_ALLOW_LOCAL_FALLBACK:-false}
    container_name: spk-stunting-frontend
    mem_limit: 128m
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
